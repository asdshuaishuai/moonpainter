# 产品记分卡清单（`scorecard.py` 的唯一输入；`docs/scorecard.md` 由它生成）
#
# 每条：id / title / status(done|partial|missing) / anchor / note，可选 gate
#   - anchor = `<文件>#<符号名>`（`fn name` / `def name` / `function name`）
#     或 `<文件>#L<行号>`；**唯一命中 1 处**才算数（腐烂就红）。
#   - gate   = `<脚本>#<slug>`，slug 必须在那个脚本的 `step-slugs:` 表里。
#   - **missing 的条目不许挂 gate**（没做的东西没有门禁在守）。
# 判据：`python3 scorecard.py --check`。

